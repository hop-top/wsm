name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Test
        run: make test

      - name: E2E (default build)
        run: make test-e2e

      - name: Verify required docs exist
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f CHANGELOG.md
          test -f docs/stories/README.md

  ubuntu-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dockerized Ubuntu test matrix
        run: make test-ubuntu-docker

  irc-ergo:
    runs-on: ubuntu-latest
    env:
      # Pinned by version and checksum together: a release asset that changed
      # under its tag must fail the job rather than silently alter what the
      # integration suite is judged against. Same version and digest as
      # .devcontainer/Dockerfile, so local and CI runs judge the same server.
      ERGO_VERSION: '2.19.1'
      ERGO_SHA256: 'c275f2de8e8eb074c38707136392290172400b5b78616cb9f660351527924b47'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install pinned ergo
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ergo.tgz \
            "https://github.com/ergochat/ergo/releases/download/v${ERGO_VERSION}/ergo-${ERGO_VERSION}-linux-x86_64.tar.gz"
          echo "${ERGO_SHA256}  /tmp/ergo.tgz" | sha256sum -c -
          # The archive nests everything under ergo-<ver>-linux-<arch>/, hence
          # strip-1. Unpacking whole keeps the languages directory beside the
          # binary, which is where the renderer resolves it from: ergo ships
          # languages.path relative to its own release directory, and a config
          # carrying that relative value fails every subcommand with "Could
          # not load languages" before it reads anything else.
          mkdir -p /opt/ergo
          tar -C /opt/ergo --strip-components=1 -xzf /tmp/ergo.tgz
          rm -f /tmp/ergo.tgz
          ln -sf /opt/ergo/ergo /usr/local/bin/ergo
          ergo --version

      - name: IRC integration suite
        env:
          ERGO_BIN: /usr/local/bin/ergo
        run: make test-irc
