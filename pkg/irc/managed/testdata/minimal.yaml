# Generated by wsm. Do not edit: every `wsm irc start` re-renders this file
# and any local change is lost. Change the wsm irc config instead.

network:
    name: "wsm.local"

server:
    name: "wsm.local"

    listeners:
        # Plaintext, loopback only: the local bot and local clients.
        "127.0.0.1:6700":

    sts:
        enabled: false

    casemapping: precis
    enforce-utf8: true

    relaymsg:
        enabled: true
        separators: "/"
        available-to-chanops: true

    websockets:
        allowed-origins: []

    ip-cloaking:
        enabled: false

    max-sendq: 96k

    compatibility:
        force-trailing: true
        send-unprefixed-sasl: false

    ip-limits:
        count: false
        throttle: false

accounts:
    # wsm provisions every account through the HTTP API; self-registration is
    # closed so the member list is the only way onto this server.
    registration:
        enabled: false
        allow-before-connect: false

    authentication-enabled: true
    require-sasl:
        enabled: true

    login-throttling:
        enabled: true
        duration: 1m
        max-attempts: 10

    advertise-scram: true

    nick-reservation:
        enabled: true
        additional-nick-limit: 0
        method: strict
        allow-custom-enforcement: false
        guest-nickname-format: "Guest-*"
        force-guest-format: false
        force-nick-equals-account: true

    multiclient:
        enabled: true
        allowed-by-default: false
        always-on: opt-in
        auto-away: opt-in

    vhosts:
        enabled: false

channels:
    default-modes: "+ntR"

    max-channels-per-client: 100

    registration:
        enabled: true
        operator-only: false
        max-channels-per-account: 100

    list-delay: 0

oper-classes:
    "wsm":
        title: "wsm"
        capabilities: ["accreg", "chanreg", "sajoin", "samode", "kill", "rehash", "history"]

opers:
    # The wsm bot. Password is the bot's own secret, bcrypt-hashed; the bot
    # also opers up automatically once SASL has authenticated the account, so
    # the password is a fallback rather than the usual path.
    wsm:
        class: "wsm"
        whois-line: "is the wsm workspace bot"
        password: "BCRYPT-HASH"
        auto: true
        hidden: true

logging:
    -
        method: stderr
        type: "* -userinput -useroutput"
        level: info

debug:
    recover-from-errors: true

limits:
    nicklen: 32
    identlen: 20
    channellen: 64
    awaylen: 390
    kicklen: 390
    topiclen: 390
    monitor-entries: 100
    whowas-entries: 100
    chan-list-modes: 60
    registration-messages: 1024

    multiline:
        max-bytes: 4096
        max-lines: 100

history:
    enabled: true
    channel-length: 1000
    client-length: 1000
    autoresize-window: 3d
    autoreplay-on-join: 0
    chathistory-maxmessages: 1000
    znc-maxmessages: 2048

    restrictions:
        expire-time: 1w
        query-cutoff: 'none'
        grace-period: 1h

    persistent:
        enabled: false

    retention:
        allow-individual-delete: false
        enable-account-indexing: false

datastore:
    path: "/DATA/ircd.db"
    autoupgrade: true

languages:
    # Absolute: ergo ships this relative, and a relative path makes every
    # subcommand fail with "Could not load languages" from wsm's data dir.
    enabled: true
    path: "/LANGUAGES"
    default: en

api:
    # Loopback only, behind a bearer token wsm generated. A misconfigured
    # listener here is a soft failure in ergo: the server logs and keeps
    # running without the API, so readiness is probed over HTTP, never assumed.
    enabled: true
    listener: "127.0.0.1:6702"
    tls: null
    bearer-tokens: ["MLu7Ua8dg5DVHe8QE6_U0n0kfHpqxldZ8jtyk90q9xE"]
